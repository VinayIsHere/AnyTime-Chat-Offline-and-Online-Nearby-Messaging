<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>AnyTime Chat</title>

    <!-- Manrope is bundled from @fontsource (imported in src/main.tsx), not
         loaded from Google Fonts: this app must look right with no internet. -->

    <!--
      SECRET PATH PREFIX (AD-08, docs/ARCHITECTURE.md section 10).

      SUBSTITUTION CONTRACT for the C++ asset server: while serving this file,
      replace the quoted placeholder on the script line below with
      "/<64-hex-token>/". It appears exactly once in the whole document, so
      replace-first and replace-all behave identically.

      Note the placeholder and the global are deliberately spelled DIFFERENTLY.
      A single token would appear twice on that line — once as the property name
      and once as the value — and a replace-all would rewrite the property name
      into `window./abc123/`, which is a syntax error. Keeping them distinct
      makes the substitution safe whether it replaces once or globally.

      Doing this server-side rather than with a post-load runJavaScript()
      injection is what makes it RACE-FREE: there is never a moment where the
      page has loaded but does not yet know its credential.

      Under `vite dev` the placeholder is served untouched, and api/base.ts
      detects that and falls back to "/". Never hard-code a real token here.
    -->
    <script>
      window.__AT_BASE__ = '%%AT_BASE%%';
    </script>

    <style>
      * { -webkit-tap-highlight-color: transparent; }
      html, body, #root { height: 100%; margin: 0; }
      /* Paint the theme background behind everything, so no WebView-white
         band can ever show below or around the app shell. */
      html, body { background: var(--at-bg, #F7F7FA); }
      body { overscroll-behavior: none; }
      /* The app draws its own scroll regions; the document never scrolls. */
      html, body, #root { overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
